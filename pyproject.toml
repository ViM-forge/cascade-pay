[project]
name = "cascade-payments"
version = "0.1.0"
description = "Durable payment cascading demo"
authors = [{name = "Cascade Payments"}]
requires-python = ">=3.13,<3.14"
dependencies = [
 "fastapi>=0.115,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
 "sqlalchemy[asyncio]>=2.0.36,<2.1", "asyncpg>=0.30,<1", "alembic>=1.14,<2",
 "taskiq>=0.11,<1", "taskiq-redis==1.2.4", "redis>=8,<9",
 "httpx>=0.28,<1", "gunicorn>=23,<24", "uvicorn>=0.34,<1",
 "uvicorn-worker>=0.3,<1", "PyJWT>=2.10,<3"
]
[tool.poetry]
packages = [{include = "payments", from = "src"}, {include = "mock_provider", from = "src"}]
requires-poetry = "==2.2.1"
[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^1.0"
ruff = "^0.14"
[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"
[tool.ruff]
target-version = "py313"
line-length = 99
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires running PostgreSQL and Redis"]
